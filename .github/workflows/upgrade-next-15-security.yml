name: Upgrade Next.js security dependencies

on:
  push:
    branches:
      - agent/upgrade-next-15-security
    paths:
      - ".github/workflows/upgrade-next-15-security.yml"
      - "scripts/migrate_next15_route_params.py"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install patched framework and React releases
        run: |
          npm install --save-exact next@15.5.21 react@19.2.8 react-dom@19.2.8
          npm install --save-dev --save-exact @types/react@19.2.17 @types/react-dom@19.2.3

      - name: Migrate asynchronous route params
        run: python scripts/migrate_next15_route_params.py

      - name: Commit generated migration and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Framework migration is already current."
            exit 0
          fi
          git commit -m "Migrate application to Next.js 15"
          git push origin HEAD:agent/upgrade-next-15-security
