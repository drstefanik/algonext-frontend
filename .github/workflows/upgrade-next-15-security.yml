name: Migrate Next.js 15 route params

on:
  push:
    branches:
      - agent/upgrade-next-15-security

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate asynchronous route params
        run: python scripts/migrate_next15_route_params.py

      - name: Commit generated route migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "Route migration is already current."
            exit 0
          fi
          git commit -m "Migrate application routes to Next.js 15"
          git push origin HEAD:agent/upgrade-next-15-security
